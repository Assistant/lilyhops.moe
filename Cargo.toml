[package]
name = "lilyhops_moe"
version = "0.2.5"
edition = "2021"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
humantime = "2.2.0"
memchr = "2.8.3"
regex = "1.13.1"
rocket = "0.5.1"
rocket_dyn_templates = { version = "0.2.0", features = ["minijinja"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.0", features = ["sync", "macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
