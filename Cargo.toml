[package]
name = "lilyhops_moe"
version = "0.2.5"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.4.0"
memchr = "2.8.3"
regex = "1.13.1"
rocket = "0.5.1"
rocket_dyn_templates = { version = "0.2.0", features = ["minijinja"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "macros", "rt-multi-thread"] }
